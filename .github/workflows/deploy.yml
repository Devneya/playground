name: Validate and deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source, dependencies, mock build, and browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: Full dependency audit
        run: npm audit
      - name: Build validation artifact
        run: npm run build:validation
        env:
          VITE_API_BASE_URL: https://api.devneya.com
          VITE_GOTRUE_ANON_KEY: validation-public-anon-key
      - name: Check validation bundle budget
        run: npm run verify:bundle
      - run: npm run build:mock
      - run: npm run verify:mock-artifact
      - run: npm run verify:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-integration

  release-browsers:
    name: Browser-integration release-candidate matrix
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mock
      - run: npm run verify:mock-artifact
      - run: npm run verify:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser-integration:matrix

  build:
    name: Build and inspect protected production artifact
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
        env:
          VITE_API_BASE_URL: https://api.devneya.com
          VITE_GOTRUE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLIC_KEY }}
      - name: Prepare GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html
      - run: npm run verify:artifact
      - run: npm run verify:bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  functional-live:
    name: Real-server functional E2E
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real-server functional E2E
        run: npm run test:e2e:real
        env:
          PLAYGROUND_E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          E2E_TEST_MODEL: ${{ secrets.PLAYGROUND_E2E_MODEL }}
          EVIDENCE_DIR: real-functional-evidence
