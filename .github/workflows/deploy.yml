name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Create env file
        run: |
          touch .env
          echo VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} >> .env
          echo VITE_SUPABASE_PUBLIC_KEY=${{ secrets.VITE_SUPABASE_PUBLIC_KEY }} >> .env
          echo VITE_PROXY_URL=${{ secrets.VITE_PROXY_URL }} >> .env
          echo VITE_LITELLM_URL=${{ secrets.VITE_LITELLM_URL }} >> .env
          echo VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }} >> .env
          echo VITE_SENTRY_URL=${{ secrets.VITE_SENTRY_URL }} >> .env
          echo VITE_TEMPLATES_INDEX_URL=${{ secrets.VITE_TEMPLATES_INDEX_URL }} >> .env
      - name: Build
        run: |
          npm ci
          npm run build --if-present
        env:
          CI: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
